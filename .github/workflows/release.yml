name: Release

# 推送 v* 标签时自动构建 Windows 安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动触发（测试用）

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 隐私闸门：扫到手机号 / 邮箱 / 密钥 / 内嵌图片 / 本机路径 / 专属敏感词就直接失败。
      # 这一步失败 = 发不出 Release，不依赖人「记得检查」。
      - name: Privacy check
        run: node scripts/privacy-check.mjs

      - name: Build renderer/main/preload
        run: npm run build

      # 先创建草稿 Release，避免 electron-builder 并发上传时竞争创建导致丢文件
      # 注意：notes 里「本版本新增」每次发版前手动更新为本版内容
      - name: Pre-create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          @"
          ## 法研台（LexBench）$env:GITHUB_REF_NAME

          本地优先的个人法律研究工作台——本版是**搜索与阅读的大升级**：法规可以像书一样整本读（带目录跳转），搜索又快又准。

          ### ✨ 新增
          - **法规全页阅读**：文档库点开法规，像图书一样整本连续阅读——右栏目录点击即跳转到对应章节，正文里编/章/节标题一目了然，读到哪下次打开回到哪，开页与跳转都有顺滑动效
          - **法内搜索**：阅读页内独立搜索框（独立于顶栏与中栏），只搜当前这部法——输入即出候选（条标+摘要），点击/回车在条文间循环跳转，全篇关键词高亮；**支持阿拉伯数字条号直查**（`1077`、`第1077条` 直达对应条款）；点空白处自动收起
          - **精准+模糊两段式全文搜索**：整句词组（如「光污染」）与全关键词命中的条文**排在最前**，任意词命中补在后面——不再被常用词淹没
          - **关键词标记全搜索面统一**：结果标题、条标、摘要、正文预览、法内候选与正文，都把**你输入的完整关键词**整词标出（accent 浅蓝胶囊，与界面同族）
          - 搜索建议示例每次启动随机换，不再常年同一组

          ### 🔄 变化
          - **搜索建议随键入实时展开**：顶栏输入即出候选（150ms 防抖 + 请求序号防乱序），中栏提速至 200ms；中文选字回车不再误触发；切换检索模式立即按新模式重搜；空查询回车给出提示
          - **法规名与条号进入全文索引**：直接搜「海商法」「第一千零七十七条」也能命中；升级首启自动重建一次索引（一次性、秒级）
          - 定位解析加宽：`民法典1077条`（无「第」）、标点/年份结尾、全角数字、「之一」后缀均能识别；定位结果每部法只取一条，不再被同号条挤掉
          - 结果 0 条时也标明所用模式与是否已自动降级；有结果时显示「共 N 条」

          ### 🔧 修复
          - **改词回车选中上一次的旧结果**（新查询根本没执行）——「有时搜不到对应的法条」的头号元凶
          - **尾数字劫持**：「年利率 24」这类关键词不再被误判成法条定位、自动跳到无关条文
          - 英文大写 `AND`/`OR`/`NOT` 不再触发搜索报错；打一半的词也能搜到（末词前缀匹配）
          - 法内搜索下拉点别处不收起、聚焦光亮与整体风格不统一、摘要高亮只标「污染」不标「光污染」，均已修正

          ### 📚 已有能力（延续 v0.8.x）
          - **苹果风界面**：Apple 体系配色、MiSans / 霞鹜文楷、无边框窗口、动效
          - **AI 研究助手**：解读本条 / 找案例 / 自由追问（流式、引用可点击核对、多模型档案）
          - **预置 36 部常用法条**（首次启动自动导入，只含法条）
          - **分类文件夹**（改名 / 删除 / 拖动排序）、两栏文档库
          - **PDF 直接看**（含扫描版）、**数据包**（换电脑 / 本地备份）
          - **自动更新**：顶栏「关于」可手动检查；发现新版本只提示，由你决定是否下载

          ### 📥 升级
          已装旧版的：启动后会提示「发现新版本 v$env:GITHUB_REF_NAME」，点「下载安装」即可；也可在顶栏「关于」里手动检查。
          全新安装：下载下方 **LexBench-Setup-$env:GITHUB_REF_NAME.exe** 双击安装；
          首次安装如遇「Windows 已保护你的电脑」：点 **更多信息 → 仍要运行**（个人开源软件未购买签名证书，属正常现象）。
          "@ | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" --draft --title "法研台（LexBench）$env:GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer & upload to draft release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $hashes = Get-ChildItem release -Include *.exe, *.blockmap -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Upload checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 草稿转正式：electron-updater 只认正式 Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
