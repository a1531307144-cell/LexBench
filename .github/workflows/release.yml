name: Release

# 推送 v* 标签时自动构建 Windows 安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动触发（测试用）

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 隐私闸门：扫到手机号 / 邮箱 / 密钥 / 内嵌图片 / 本机路径 / 专属敏感词就直接失败。
      # 这一步失败 = 发不出 Release，不依赖人「记得检查」。
      - name: Privacy check
        run: node scripts/privacy-check.mjs

      - name: Build renderer/main/preload
        run: npm run build

      # 先创建草稿 Release，避免 electron-builder 并发上传时竞争创建导致丢文件
      # 注意：notes 里「本版本新增」每次发版前手动更新为本版内容
      - name: Pre-create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # 安装包文件名不带 v 前缀（LexBench-Setup-0.9.12.exe），说明文字用去 v 的版本号
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          @"
          ## 法研台（LexBench）$env:GITHUB_REF_NAME

          本版为**笔记编辑体验更新**：笔记支持整体撤销 / 重做与手动保存；插入法条改为普通文本，可直接删除，并与文档库解除关联。

          ### ✨ 新增
          - **撤销 / 重做**：大纲、导图、标题、备注、待办、行内格式与图片共用一套撤销栈；笔记头部新增撤销 / 重做按钮，支持 Ctrl+Z / Ctrl+Shift+Z / Ctrl+Y
          - **手动保存**：笔记头部保存按钮显示未保存 / 保存中 / 已保存 / 保存失败，支持 Ctrl+S；与自动保存共用保存队列
          - **删除整行**：每行悬停新增删除入口，连同子级一次删除；撤销可恢复

          ### 🔄 变更
          - **插入法条**：仍可从文档库搜索插入，但只写入普通文本（条名 + 正文），不再建立与文档库的长期关联
          - **旧引用兼容**：已有引用节点打开即按普通文本显示，编辑保存后清除引用元数据
          - 阅读页移除「复制引用」，笔记移除「在文档库打开来源」

          ### 🛠 修正
          - 输入后立即撤销、撤销后重做与导图撤销 / 重做的一致性
          - 自动保存与手动保存并发时的状态与落盘顺序
          - 切换笔记 / 往返方向时用旧快照覆盖编辑器内容

          ### 🔄 说明
          - 撤销历史仅在本次运行内保留（按笔记分别保存，切换后仍可用），重启应用后清空
          - 笔记库的新建 / 删除 / 移动 / 文件夹操作不在撤销范围内
          - 已有文档、笔记、批注与数据包不受影响
          - 零新增运行时依赖

          ### 📚 已有能力
          - 笔记库（大纲 / 导图双向编辑 / 图片 / 分类 / 备注 / 待办）、法条批注
          - 法规全页阅读 + 目录跳转 + 法内搜索；全文检索与实时建议
          - AI 通用问答助手（独立窗口）、预置 36 部常用法条、PDF 阅读、数据包备份与自动更新
          - 浅色专业界面：中性灰底 / 主题蓝 / MiSans + 霞鹜文楷 / 无边框窗口 / 动效

          ### 📥 升级
          已装旧版的：启动后会提示「发现新版本 $env:GITHUB_REF_NAME」，点「下载安装」即可；也可在顶栏「关于」里手动检查。
          全新安装：下载下方 **LexBench-Setup-$ver.exe** 双击安装；
          首次安装如遇「Windows 已保护你的电脑」：点 **更多信息 → 仍要运行**（个人开源软件未购买签名证书，属正常现象）。
          "@ | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" --draft --title "法研台（LexBench）$env:GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer & upload to draft release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $hashes = Get-ChildItem release -Include *.exe, *.blockmap -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Upload checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 草稿转正式：electron-updater 只认正式 Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
