name: Release

# 推送 v* 标签时自动构建 Windows 安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动触发（测试用）

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 隐私闸门：扫到手机号 / 邮箱 / 密钥 / 内嵌图片 / 本机路径 / 专属敏感词就直接失败。
      # 这一步失败 = 发不出 Release，不依赖人「记得检查」。
      - name: Privacy check
        run: node scripts/privacy-check.mjs

      - name: Build renderer/main/preload
        run: npm run build

      # 先创建草稿 Release，避免 electron-builder 并发上传时竞争创建导致丢文件
      # 注意：notes 里「本版本新增」每次发版前手动更新为本版内容
      - name: Pre-create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # 安装包文件名不带 v 前缀（LexBench-Setup-0.8.5.exe），说明文字用去 v 的版本号
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          @"
          ## 法研台（LexBench）$env:GITHUB_REF_NAME

          本地优先的个人法律研究工作台——本版是**笔记库来了**：全应用重组为「文档库 / 笔记」双方向，大纲式笔记（可转思维导图编辑）、法条批注、通用大纲导入一次到位。

          ### ✨ 新增
          - **笔记库**：大纲式笔记——一行一个节点，Enter 新行、Tab/Shift+Tab 缩进、行首 Backspace 并入上一行、节点折叠、圆点拖动排序、自动保存（切走前强制冲刷不丢字）
          - **思维导图视图**：「⇄ 导图」一键互转、同一份内容实时同步——导图内双击改文字、Enter 加兄弟、Tab 加子节点、Delete 删除、拖拽改挂载；方向键移动选中框（← 回父级、→ 进子级、↑↓ 兄弟间，结构无解时自动找屏幕上最近的节点）；重开笔记记住上次视图
          - **法条引用通道**：阅读页选中右键「复制引用」→ 粘进笔记成引用节点；笔记内空行按 `/` 或 `@` 唤出插入浮层搜库内法条、「＋」连加；引用节点右键「在文档库打开来源」直达原文
          - **法条批注**：阅读时选中条文右键「添加批注」→ 浮窗随手写 → 点外面自动收起，选区留高亮与常驻 ★；点 ★ 随时查看/修改；另有条文修正（✎）
          - **笔记贴图**：Ctrl+V 直接把图片粘到节点上，随笔记保存、随数据包备份
          - **笔记自定义分类**：新建/改名/删除/拖动排序（删除分类笔记归入未分类），新建笔记直接落在当前分类
          - **通用大纲导入**：笔记面板「导入」——支持 **OPML / HTML / Markdown 等业界通用格式**；导入前逐篇预检（可勾选剔除），文中图片自动下载到本机，同源文件可跳过或覆盖
          - **阅读续读**：从笔记切回文档库自动回到上次阅读位置（无横幅）；阅读中切走也不丢进度
          - **星标法条**：法条旁点亮 ☆，笔记库左列一键直达

          ### 🔄 变化
          - **左侧竖排导航**：「文档库 / 笔记」常驻左缘，悬停即出选择面板，移开自动收起——浏览界面不再平铺占区，空间留给正文
          - **阅读页保留导航**：阅读时竖排导航仍在（随时悬停换文档），右上角「⛶ 全区」一键沉浸全宽
          - **搜索再提速**：精准+模糊两段式排序、法规名与条号入索引、实时建议（v0.8.5 能力延续）
          - 旧「专题」板块退场，其收集与导出职责由笔记库承接

          ### 🔧 修复
          - **法典「第X分编」层级**：此前被吞进上一条正文、目录丢层——切分、目录、跳转全链路补齐
          - **右键菜单**：正文与输入框右键补齐复制/粘贴等常用项（此前右键无反应）
          - 改词回车吃旧结果、尾数字劫持、AND 报错等搜索问题（v0.8.5 已修，延续）

          ### 📚 已有能力（延续 v0.8.x）
          - **苹果风界面**：Apple 体系配色、MiSans / 霞鹜文楷、无边框窗口、动效
          - **AI 通用问答助手**：独立窗口、随问随答（流式、引用可点击核对、多模型档案）
          - **预置 36 部常用法条**（首次启动自动导入，只含法条）
          - **分类文件夹**（改名 / 删除 / 拖动排序）、两栏文档库
          - **PDF 直接看**（含扫描版）、**数据包**（换电脑 / 本地备份，含笔记贴图）
          - **自动更新**：顶栏「关于」可手动检查；发现新版本只提示，由你决定是否下载

          ### 📥 升级
          已装旧版的：启动后会提示「发现新版本 $env:GITHUB_REF_NAME」，点「下载安装」即可；也可在顶栏「关于」里手动检查。
          全新安装：下载下方 **LexBench-Setup-$ver.exe** 双击安装；
          首次安装如遇「Windows 已保护你的电脑」：点 **更多信息 → 仍要运行**（个人开源软件未购买签名证书，属正常现象）。
          "@ | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" --draft --title "法研台（LexBench）$env:GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer & upload to draft release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $hashes = Get-ChildItem release -Include *.exe, *.blockmap -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Upload checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 草稿转正式：electron-updater 只认正式 Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
