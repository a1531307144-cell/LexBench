name: Release

# 推送 v* 标签时自动构建 Windows 安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动触发（测试用）

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 隐私闸门：扫到手机号 / 邮箱 / 密钥 / 内嵌图片 / 本机路径 / 专属敏感词就直接失败。
      # 这一步失败 = 发不出 Release，不依赖人「记得检查」。
      - name: Privacy check
        run: node scripts/privacy-check.mjs

      - name: Build renderer/main/preload
        run: npm run build

      # 先创建草稿 Release，避免 electron-builder 并发上传时竞争创建导致丢文件
      # 注意：notes 里「本版本新增」每次发版前手动更新为本版内容
      - name: Pre-create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          @"
          ## 法研台（LexBench）$env:GITHUB_REF_NAME

          本地优先的个人法律研究工作台——本版新增**研究工作台**与**阅读模式**。

          ### ✨ 研究工作台
          - **专题**：把常用法条按研究主题收藏成组（★ 收藏、去重、上移下移排序）
          - **笔记**：关联具体法条的批注 + 专题级备忘，Markdown 编辑/预览
          - **一键导出研究报告**：Markdown / Word——法条全文 + 关联笔记 + 专题笔记，落款齐全

          ### ✨ 阅读模式（读书/读文献）
          - **书籍导入**：导入时可选「书籍资料」类型，按段落建索引（正文也可全文检索）
          - **左书右批注**：760px 衬线正文 + 可收起批注栏，沉浸排版
          - **划选即记**：一选中文字立即弹批注表单（引用自动带入），**段内/跨段都支持**，原文自动高亮、点高亮与批注互相跳转
          - **进度记忆**：重开软件回到上次阅读位置
          - **读书笔记导出**：引用 + 批注成对列出（md / Word）

          ### 🛠 体验修复
          - 操作报错现在直接显示中文原因（不再夹带英文技术前缀）
          - 工作台交互五处细节打磨（重命名入口、条目排序、收藏反馈等）

          ### 📥 安装
          下载下方 **LexBench-Setup-$env:GITHUB_REF_NAME.exe** 双击安装。
          首次安装如遇「Windows 已保护你的电脑」：点 **更多信息 → 仍要运行**（个人开源软件未购买签名证书，属正常现象）。
          "@ | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" --draft --title "法研台（LexBench）$env:GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer & upload to draft release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $hashes = Get-ChildItem release -Include *.exe, *.blockmap -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Upload checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 草稿转正式：electron-updater 只认正式 Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
