name: Release

# 推送 v* 标签时自动构建 Windows 安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动触发（测试用）

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 隐私闸门：扫到手机号 / 邮箱 / 密钥 / 内嵌图片 / 本机路径 / 专属敏感词就直接失败。
      # 这一步失败 = 发不出 Release，不依赖人「记得检查」。
      - name: Privacy check
        run: node scripts/privacy-check.mjs

      - name: Build renderer/main/preload
        run: npm run build

      # 先创建草稿 Release，避免 electron-builder 并发上传时竞争创建导致丢文件
      # 注意：notes 里「本版本新增」每次发版前手动更新为本版内容
      - name: Pre-create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # 安装包文件名不带 v 前缀（LexBench-Setup-0.9.13.exe），说明文字用去 v 的版本号
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          @"
          ## 法研台（LexBench）$env:GITHUB_REF_NAME

          本版聚焦**边读边写**：新增可保存布局的「平行视图」；同时带来 15 套全局配色、法条候选正文预览与 PDF 阅读壳。

          ### ✨ 新增
          - **平行视图**：左侧第三入口，一篇笔记 + 多个文档窗。默认分屏网格（1 满宽 / 2 左右 / 3 上一下二 / 4 2×2 / 5+ 两列），分隔条可拖；可切浮动模式自由拖动、四边四角缩放、常驻置顶；支持「全区」隐藏侧栏；可同时打开多个文档窗
          - **一笔记一视图**：平行视图与笔记一一对应，左侧用文件卡片展示全部笔记（数量与笔记一致）；「＋ 新建」明确二选一（新建笔记 / 从现有笔记创建，搜索为可选操作）；支持改名、重置布局；删除笔记时视图自动消失
          - **文档窗**：可随时从文档库更换文档；拖文件到文档区会先加入文档库，再在该区打开
          - **PDF 阅读壳**：隐藏 Chromium 自带 PDF 工具栏，改用应用自己的页数、跳页、缩放、本页笔记与批注栏；自动探测真实页数
          - **法条插入预览**：插入法条浮层的每条候选显示最多三行正文摘要，并高亮关键词
          - **外观主题**：浅色 9 套、深色 6 套（纯境 / 明线 / 素页 / 墨稿 / 雁皮 / 薄雾 / 清风 / 脉搏 / 远航 / 焦点 / 深渊 / 夜图 / 秘林 / 火山 / 梦湖），主窗口与 AI 独立窗同步，随本机设置保存

          ### 🔄 变更
          - 全应用深色适配：阅读页、笔记编辑器、导图外壳、对话框与提示条统一使用主题令牌
          - 顶栏在最小窗口宽度下自动收起英文品牌与多余留白，按钮不再互相挤压
          - 平行视图窗内阅读进度 / 缩放只由焦点窗写入，避免多窗互相覆盖

          ### 🛠 修正
          - 导图节点插入图片后只停留在画布、未写入笔记

          ### 📚 已有能力
          - 文档库（Word / PDF / TXT、法规自动切条、分类文件夹、拖动排序）
          - 法条定位 + 全文检索（高亮 / 摘要 / 实时建议）、法规全页阅读与目录 / 法内搜索 / 批注
          - 大纲笔记 + 导图、撤销 / 重做、手动保存、图片 / 备注 / 待办
          - AI 通用问答助手（独立窗口、多模型档案）
          - 预置 36 部常用法条、数据包备份、自动更新

          ### 📥 升级
          已装旧版：启动后会提示「发现新版本 $env:GITHUB_REF_NAME」，点「下载安装」即可；也可在顶栏「关于」里手动检查。
          全新安装：下载下方 **LexBench-Setup-$ver.exe** 双击安装；
          首次安装如遇「Windows 已保护你的电脑」：点 **更多信息 → 仍要运行**（个人开源软件未购买签名证书，属正常现象）。

          本版不新增运行时依赖。
          "@ | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" --draft --title "法研台（LexBench）$env:GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer & upload to draft release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $hashes = Get-ChildItem release -Include *.exe, *.blockmap -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Upload checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 草稿转正式：electron-updater 只认正式 Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
