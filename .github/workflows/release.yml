name: Release

# 推送 v* 标签时自动构建 Windows 安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动触发（测试用）

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # 隐私闸门：扫到手机号 / 邮箱 / 密钥 / 内嵌图片 / 本机路径 / 专属敏感词就直接失败。
      # 这一步失败 = 发不出 Release，不依赖人「记得检查」。
      - name: Privacy check
        run: node scripts/privacy-check.mjs

      - name: Build renderer/main/preload
        run: npm run build

      # 先创建草稿 Release，避免 electron-builder 并发上传时竞争创建导致丢文件。
      # 发布说明的**唯一来源**是仓库根的 RELEASE_NOTES.md（每版手写一次，随 tag 固化），
      # 不再在这里重复维护第二份文案。版本号对不上会直接失败，防止忘改。
      - name: Pre-create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not (Test-Path RELEASE_NOTES.md)) {
            Write-Error "缺少 RELEASE_NOTES.md：发布说明必须有单一来源"
            exit 1
          }
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $notes = Get-Content RELEASE_NOTES.md -Raw -Encoding utf8
          if ($notes -notmatch [regex]::Escape("v$ver")) {
            Write-Error "RELEASE_NOTES.md 中找不到版本号 v$ver，说明可能忘记更新"
            exit 1
          }
          gh release create "$env:GITHUB_REF_NAME" --draft --title "法研台（LexBench）$env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer & upload to draft release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $hashes = Get-ChildItem release -Include *.exe, *.blockmap -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Upload checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 草稿转正式：electron-updater 只认正式 Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
