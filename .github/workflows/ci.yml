name: CI

# 每次推送 / PR：类型检查 + 单测 + 隐私扫描 + 构建（不含打包；打包发版走 release.yml）
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Privacy check
        run: node scripts/privacy-check.mjs

      - name: Build renderer/main/preload
        run: npm run build
